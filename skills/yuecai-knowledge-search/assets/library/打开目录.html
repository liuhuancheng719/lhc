<script>
const records=JSON.parse(document.getElementById('data').textContent),input=document.getElementById('search'),list=document.getElementById('results');
function matches(r,query){const text=[r.title,r.summary,r.code,r.category].join(' ').toLocaleLowerCase();return query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean).every(word=>text.includes(word))}
function highlighted(node,text,q){if(!q.trim()){node.textContent=text;return}const words=q.trim().split(/\s+/).filter(Boolean).sort((a,b)=>b.length-a.length);let pos=0;const lower=text.toLocaleLowerCase();while(pos<text.length){let next=-1,found='';for(const word of words){let at=lower.indexOf(word.toLocaleLowerCase(),pos);if(at>=0&&(next<0||at<next)){next=at;found=word}}if(next<0){node.append(document.createTextNode(text.slice(pos)));break}node.append(document.createTextNode(text.slice(pos,next)));const mark=document.createElement('mark');mark.textContent=text.slice(next,next+found.length);node.append(mark);pos=next+found.length}}

if(!filtered.length){const e=document.createElement('div');e.className='empty';e.textContent='没有找到匹配需求，请尝试其他关键词。';list.append(e);return}
